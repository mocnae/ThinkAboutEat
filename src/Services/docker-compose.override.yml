version: '3.4'

services:
  productsdb:
    container_name: productsdb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ProductsDb
    restart: always
    ports:
        - "5432:5432"
    volumes:
      - postgres-products:/var/lib/postgresql/data/ 

  recipesdb:
    container_name: recipesdb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=RecipesDb
    restart: always
    ports:
        - "5433:5432"
    volumes:
      - postgres-recipes:/var/lib/postgresql/data/ 

  products.api:
    image: productsapi
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ASPNETCORE_Kestrel__Certificates__Default__Password=cert1234
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/home/app/.aspnet/https/thinkabouteat.pfx
      - ConnectionStrings__Database=Server=productsdb;Port=5432;Database=ProductsDb;User Id=postgres;Password=postgres;Include Error Detail=true
    depends_on:
      - productsdb
    ports:
      - "6000:8080"
      - "6060:8081"
    volumes:
      - ~/.aspnet/https:/home/app/.aspnet/https:ro